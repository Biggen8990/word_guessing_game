<!DOCTYPE html>
<html>
<head>
    <title>{% block title %}Word Guessing Game{% endblock %}</title>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #f5f7fa;
            color: #283747;
            margin: 0;
            padding: 0;
            min-height: 100vh;
        }
        .game-container {
            max-width: 480px;
            margin: 40px auto 0 auto;
            padding: 32px 24px;
            background: #fff;
            border-radius: 18px;
            box-shadow: 0 2px 10px #3b3b3b22;
        }
        h1, h2 {
            text-align: center;
            color: #2d9ab7;
        }
        .message, .hint {
            font-size: 1.2em;
            margin: 15px 0;
            text-align: center;
        }
        .message.success { color: green; }
        .message.error, .hint.fail { color: #ae2323; }
        .hint { color: #87615e; font-style: italic; }
        form { display: flex; flex-direction: column; align-items: center; gap: 12px; margin-bottom: 20px; }
        input[type="text"], input[name="guess"] {
            padding: 9px 12px;
            width: 70%;
            border: 1px solid #bbb;
            border-radius: 6px;
            font-size: 1.1em;
        }
        input[type="submit"] {
            background: #2d9ab7;
            color: #fff;
            border: none;
            border-radius: 6px;
            padding: 10px 30px;
            font-size: 1.1em;
            cursor: pointer;
        }
        input[type="submit"]:hover {
            background: #16697a;
        }
        .link-bar {
            margin-top: 18px; text-align: center;
        }
        .link-bar a {
            color: #2d9ab7; text-decoration: none; margin: 0 8px; font-weight: 600;
        }
        .link-bar a:hover { text-decoration: underline; }
        table { width: 95%; margin: 0 auto 20px; border-collapse: collapse; }
        th, td {
            border: 1px solid #bbb;
            padding: 8px;
            text-align: center;
        }
        th { background: #f4f4f4; color: #222; }
    </style>
    {% block extrahead %}{% endblock %}
</head>
<body>
    <div class="game-container">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
