{% extends "base.html" %}
{% block title %}View/Edit Profile - Word Guessing Game{% endblock %}
{% block content %}
<h2>Your Profile</h2>
<form method="post">
    <label>Username: <input name="username" value="{{ username }}"></label><br>
    <label>Tier: 
        <select name="tier">
            <option value="free" {% if user_tier=='free' %}selected{% endif %}>Free</option>
            <option value="paid" {% if user_tier=='paid' %}selected{% endif %} {% if not demo_mode %}disabled{% endif %}>Paid</option>
            <option value="premium" {% if user_tier=='premium' %}selected{% endif %} {% if not demo_mode %}disabled{% endif %}>Premium</option>
            <option value="admin" {% if user_tier=='admin' %}selected{% endif %} {% if not demo_mode %}disabled{% endif %}>Admin</option>
        </select>
    </label><br>
    <input type="submit" value="Update Profile">
</form>
<a href="/">Return to Main Menu</a>
{% endblock %}
